<!-- TOPBAR COMPONENT -->
<header class="topbar d-flex align-items-center justify-content-between px-3 px-md-4">
  <!-- Left: Logo -->
  <div class="d-flex align-items-center">
    <a href="user.html">
      <img src="../../assets/img/logo.png" alt="ChickNPastil Logo" class="topbar-logo" />
    </a>
  </div>

  <!-- Page Header Title: Right-aligned on mobile (ms-auto), centered on desktop -->
  <div class="text-end text-md-center ms-auto ms-md-0 me-md-0">
    <h4 class="m-0 fw-semibold text-dark fs-5 fs-md-4" id="page-title-heading">Page Header</h4>
    <small class="d-block text-muted mt-1" id="branch-location">
      <i class="bi bi-geo-alt-fill me-1" aria-hidden="true"></i>
      <span>Branch Location</span>
    </small>
  </div>

  <!-- Right: User Info & Avatar (Hidden on screens smaller than 768px / md breakpoint) -->
  <div class="d-none d-md-flex align-items-center">
    <div class="text-end">
      <div class="fw-bold text-dark lh-1" style="font-size: 1.05rem;">User Staff Full Name</div>
      <small class="text-muted" style="font-size: 0.85rem;">User Staff Role</small>
    </div>
  </div>
</header>
