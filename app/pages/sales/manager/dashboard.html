<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sales Operations - Chick N Pastil</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/sales/shared/style.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .dashboard-container {
      max-width: 1100px;
      margin-left: 0;
    }
    .kpi-card {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      padding: 18px 22px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .kpi-card:hover {
      border-color: var(--primary-green);
      box-shadow: 0 4px 12px rgba(30, 86, 49, 0.08);
    }
    .kpi-card .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }
    .nav-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 30px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.15s ease;
      min-width: 180px;
    }
    .nav-pill-btn:hover {
      border-color: var(--primary-green);
      background: var(--primary-green-light);
      color: var(--primary-green);
    }
    .alert-card {
      background: #ffffff;
      border: 1.5px solid #e2ebd8;
      border-radius: 18px;
      padding: 22px;
    }
    .alert-item {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .alert-warning-custom {
      background-color: #fff9ed;
      border-left: 4px solid #f59e0b;
      color: #78350f;
    }
    .alert-info-custom {
      background-color: #f0fdf4;
      border-left: 4px solid var(--primary-green);
      color: #14532d;
    }
  </style>
</head>
<body data-page-header="Live Sales Operations">

  <div id="topbar-wrapper"></div>
  <div class="app-container">
    <div id="sidebar-wrapper"></div>

  <!-- Main Content Area (left-aligned) -->
  <main class="main-content">
    <div class="dashboard-container">
      
      <!-- Top Controls: Branch Filter & Refresh -->
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 fw-semibold text-muted small">Branch View:</label>
          <select id="branch-filter" class="form-select form-select-sm" style="width: 200px; border-radius: 20px; font-weight: 600; border-color: var(--primary-green);" onchange="fetchDashboardStats()">
            <option value="All Branches">All Branches</option>
          </select>
        </div>

        <div class="d-flex align-items-center gap-2">
          <!-- <span class="badge bg-light text-dark border px-3 py-2 rounded-pill small">
            <i class="bi bi-circle-fill text-success me-1 small"></i> Live Real-Time
          </span> -->
          <button class="btn btn-sm btn-outline-success rounded-pill px-3" onclick="fetchDashboardStats()">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
          </button>
        </div>
      </div>

      <!-- Main Layout: 2 Columns -->
      <div class="row g-4">
        
        <!-- Left Column: Metrics & Quick Nav -->
        <div class="col-lg-7">
          
          <!-- Metrics Grid -->
          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <div class="kpi-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="kpi-total-orders">0</div>
                <small class="text-muted"><i class="bi bi-receipt me-1"></i>Processed transactions</small>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="kpi-card">
                <div class="stat-label">Total Sales Revenue</div>
                <div class="stat-value text-success" id="kpi-total-revenue">Php 0.00</div>
                <small class="text-muted"><i class="bi bi-graph-up-arrow me-1"></i>Completed sales</small>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="kpi-card">
                <div class="stat-label">Total Cash Transactions</div>
                <div class="stat-value" id="kpi-total-cash">Php 0.00</div>
                <small class="text-muted"><i class="bi bi-cash-stack me-1"></i>Cash in drawer</small>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="kpi-card">
                <div class="stat-label">Total GCash Transactions</div>
                <div class="stat-value text-primary" id="kpi-total-gcash">Php 0.00</div>
                <small class="text-muted"><i class="bi bi-wallet2 me-1"></i>GCash</small>
              </div>
            </div>
          </div>

          <!-- Quick Navigation Section -->
          <div class="mt-4">
            <h6 class="fw-bold text-dark text-uppercase small tracking-wide mb-3">Navigate Operations</h6>
            <div class="d-flex flex-wrap gap-2">
              <a href="/sales/pos/ordering" class="nav-pill-btn shadow-sm" style="background-color: var(--primary-green); color: #ffffff; border-color: var(--primary-green);">
                <i class="bi bi-cart-plus-fill me-2"></i> Create Order
              </a>
              <a href="/sales/manager/transactions" id="btn-today-transactions" class="nav-pill-btn shadow-sm">
                <i class="bi bi-journal-text me-2"></i> Today Transactions
              </a>
              <a href="/sales/manager/menu" id="btn-menu-display-manager" class="nav-pill-btn shadow-sm manager-only-link">
                <i class="bi bi-ui-checks-grid me-2"></i> Menu Display
              </a>
            </div>
          </div>

        </div>

        <!-- Right Column: Sales-Only System Alerts -->
        <div class="col-lg-5">
          <div class="alert-card shadow-sm h-100">
            <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
              <div class="text-danger fs-4"><i class="bi bi-exclamation-triangle-fill"></i></div>
              <h5 class="fw-bold mb-0 text-dark">System Alerts</h5>
            </div>
            
            <div id="alerts-container">
              <div class="text-center py-4 text-muted">
                <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                Analyzing live sales data...
              </div>
            </div>

          </div>
        </div>

      </div>

    </div>
  </main>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared Components -->
  <script src="../../js/shared/bars.js"></script>

  <script>
    async function fetchDashboardStats() {
      const user = window.getCurrentUser ? window.getCurrentUser() : { role: 'Manager', branch: 'Balagtas' };
      const branchFilter = document.getElementById('branch-filter').value;
      
      try {
        const res = await fetch(`/api/dashboard/stats?branch=${encodeURIComponent(branchFilter)}`);
        const data = await res.json();

        if (data.success) {
          document.getElementById('kpi-total-orders').textContent = data.totalOrders;
          document.getElementById('kpi-total-revenue').textContent = `Php ${Number(data.totalSalesRevenue).toFixed(2)}`;
          document.getElementById('kpi-total-cash').textContent = `Php ${Number(data.totalCash).toFixed(2)}`;
          document.getElementById('kpi-total-gcash').textContent = `Php ${Number(data.totalGCash).toFixed(2)}`;

          renderAlerts(data.alerts);
        }
      } catch (err) {
        console.error('Error fetching dashboard stats:', err);
      }
    }

    function renderAlerts(alerts) {
      const container = document.getElementById('alerts-container');
      if (!alerts || alerts.length === 0) {
        container.innerHTML = `<div class="p-3 text-muted small bg-light rounded-3">No active sales warnings at this time. Operations normal.</div>`;
        return;
      }

      container.innerHTML = alerts.map(a => `
        <div class="alert-item ${a.type === 'warning' ? 'alert-warning-custom' : 'alert-info-custom'}">
          <div class="fw-bold mb-1">${a.title}</div>
          <div>${a.message}</div>
        </div>
      `).join('');
    }

    async function loadBranchFilter() {
      const select = document.getElementById('branch-filter');
      try {
        const response = await fetch('/user/manager/branches');
        if (!response.ok) throw new Error('Unable to load branch locations.');
        const data = await response.json();
        for (const branch of (data.branches || []).filter(item => item.status === 'active')) {
          const option = document.createElement('option');
          option.value = branch.location_name;
          option.textContent = branch.location_name;
          select.append(option);
        }
      } catch (error) {
        console.error('Error loading branch filter:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (user) {
        const select = document.getElementById('branch-filter');
        if (user.role === 'Staff' && select) {
          select.value = user.branch;
          select.disabled = true;
          const todayBtn = document.getElementById('btn-today-transactions');
          if (todayBtn) todayBtn.setAttribute('href', '/sales/staff/transactions');
        }
      }
      await loadBranchFilter();
      fetchDashboardStats();
    });
  </script>
</body>
</html>
